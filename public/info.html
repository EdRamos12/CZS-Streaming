<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CZS Info (banner + text + chat)</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body data-scene="talk" data-camera="1">
  <section id="talk" class="scene">
    <img class="bridge" src="assets/ponte.svg" alt="">
    <header><img src="assets/logo.png" alt=""><div><div class="t title"></div><div class="s subtitle"></div></div></header>
    <div id="info">
      <div class="slides" id="infoBanner"></div>
      <div class="view" id="infoView"><div id="infoText"></div></div>
    </div>
    <div id="chat"><h3>Chat</h3><div id="chatArea"></div></div>
  </section>
<script src="common.js"></script>
<script src="overlay.js"></script>
</body>
</html>
